name: Release Extension

# push a tag that matches CSXS/manifest.xml's ExtensionBundleVersion, e.g. v1.1.0.
# a plain tag becomes the latest release, which the panel's update banner reads;
# a tag with a dash (v1.1.0-beta1) is a pre-release and never shows the banner.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build installers
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check tag matches manifest version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $xml = Get-Content AMVerge/CSXS/manifest.xml -Raw
          if ($xml -notmatch 'ExtensionBundleVersion="([^"]+)"') { throw "No ExtensionBundleVersion in manifest.xml" }
          $manifest = $Matches[1]
          # a pre-release tag only needs its base to match (v1.1.0-beta1 -> 1.1.0)
          $base = $tag.Split("-")[0]
          if ($base -ne $manifest) { throw "Tag $tag does not match manifest version $manifest. Bump CSXS/manifest.xml first." }
          "VERSION=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tools/package-lock.json

      - name: Install build tools
        run: npm ci --prefix tools

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Restore signing certificate
        # optional: without the secret, build.js self-signs a new cert each run
        shell: pwsh
        env:
          CERT_P12_BASE64: ${{ secrets.EXTENSION_CERT_P12_BASE64 }}
        run: |
          if ($env:CERT_P12_BASE64) {
            [IO.File]::WriteAllBytes("tools/cert.p12", [Convert]::FromBase64String($env:CERT_P12_BASE64))
            "Using repository certificate"
          } else {
            "No EXTENSION_CERT_P12_BASE64 secret, a self-signed certificate will be generated"
          }

      - name: Stage uv for every platform
        run: node tools/fetch-uv.js --all

      - name: Build universal AE 2018+ installer & ZXP
        run: node tools/build.js

      - name: Collect release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $files = Get-ChildItem "dist\*" -File -Include "AMVergeSetup.exe", "AMVerge.zxp"
          if ($files.Count -lt 2) {
            Get-ChildItem dist -Recurse | ForEach-Object { $_.FullName }
            throw "Expected universal AMVergeSetup.exe and AMVerge.zxp, found $($files.Count)"
          }
          $files | Copy-Item -Destination release
          Get-ChildItem release

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          $aeSvg = "data:image/svg+xml;base64,"
          $winSvg = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0id2hpdGUiPjxwYXRoIGQ9Ik0wIDMuNDQ5TDkuNzUgMi4xdjkuNDUxSDBtMTAuOTQ5LTkuNjAyTDI0IDB2MTEuNEgxMC45NDlNMCAxMi42aDkuNzV2OS40NUwwIDIwLjY5OW0xMC45NDktOC4xaDEzLjA1MVYyNGwtMTMuMDUxLTEuODQiLz48L3N2Zz4="
          @"
          ## Downloads

          | Platform / Format | Package | Compatibility | Download |
          | :--- | :--- | :--- | :--- |
          | ![Windows](https://img.shields.io/badge/Windows-Setup_Wizard-0078D6?style=flat&logo=$winSvg) | <kbd>AMVergeSetup.exe</kbd> | <kbd>After Effects CC 2018+</kbd> | [![Download Setup Wizard](https://img.shields.io/badge/Download_Setup_Wizard-0078D6?style=for-the-badge&logo=$winSvg)](https://github.com/$repo/releases/download/$tag/AMVergeSetup.exe) |
          | ![ZXP](https://img.shields.io/badge/After_Effects-Signed_ZXP-9999FF?style=flat&logo=$aeSvg) | <kbd>AMVerge.zxp</kbd> | <kbd>ZXPInstaller / AE 2018+</kbd> | [![Download .zxp](https://img.shields.io/badge/Download_.zxp-7C3AED?style=for-the-badge&logo=$aeSvg)](https://github.com/$repo/releases/download/$tag/AMVerge.zxp) |
          "@ | Set-Content -Path release_notes.md -Encoding utf8

          $flags = @("--notes-file", "release_notes.md", "--title", "AMVerge Extension $env:VERSION")
          if ($tag.Contains("-")) { $flags += "--prerelease" } else { $flags += "--latest" }
          gh release create $tag (Get-ChildItem release).FullName @flags
