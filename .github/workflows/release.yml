name: Release Extension

# push a tag that matches CSXS/manifest.xml's ExtensionBundleVersion, e.g. v1.1.0.
# a plain tag becomes the latest release, which the panel's update banner reads;
# a tag with a dash (v1.1.0-beta1) is a pre-release and never shows the banner.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build installers
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check tag matches manifest version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $xml = Get-Content AMVerge/CSXS/manifest.xml -Raw
          if ($xml -notmatch 'ExtensionBundleVersion="([^"]+)"') { throw "No ExtensionBundleVersion in manifest.xml" }
          $manifest = $Matches[1]
          # a pre-release tag only needs its base to match (v1.1.0-beta1 -> 1.1.0)
          $base = $tag.Split("-")[0]
          if ($base -ne $manifest) { throw "Tag $tag does not match manifest version $manifest. Bump CSXS/manifest.xml first." }
          "VERSION=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tools/package-lock.json

      - name: Install build tools
        run: npm ci --prefix tools

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Restore signing certificate
        # optional: without the secret, build.js self-signs a new cert each run
        shell: pwsh
        env:
          CERT_P12_BASE64: ${{ secrets.EXTENSION_CERT_P12_BASE64 }}
        run: |
          if ($env:CERT_P12_BASE64) {
            [IO.File]::WriteAllBytes("tools/cert.p12", [Convert]::FromBase64String($env:CERT_P12_BASE64))
            "Using repository certificate"
          } else {
            "No EXTENSION_CERT_P12_BASE64 secret, a self-signed certificate will be generated"
          }

      - name: Stage uv for every platform
        run: node tools/fetch-uv.js --all

      - name: Build AE2018
        run: node tools/build.js --target=2018

      - name: Build AE2020
        run: node tools/build.js --target=2020

      - name: Build AE2022
        run: node tools/build.js --target=2022

      - name: Collect release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $files = Get-ChildItem dist -Recurse -Include "AMVergeSetup_*.exe", "AMVerge_*.zxp"
          if ($files.Count -lt 6) {
            $files | ForEach-Object { $_.FullName }
            throw "Expected 3 installers and 3 zxp packages, found $($files.Count)"
          }
          $files | Copy-Item -Destination release
          Get-ChildItem release

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $flags = @("--generate-notes", "--title", "AMVerge Extension $env:VERSION")
          if ($tag.Contains("-")) { $flags += "--prerelease" } else { $flags += "--latest" }
          gh release create $tag (Get-ChildItem release).FullName @flags
