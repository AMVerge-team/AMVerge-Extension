<div id="page-home" class="page active">
  <div id="importArea" class="import-area">
    <div id="importIdle" class="import-idle">
      <div class="import-idle-top">
        <span class="amverge-wordmark amverge-wordmark-full"><span class="wm-accent">AMV</span>erge</span>
        <p class="import-tagline">Scene selection made easy.</p>

        <div id="aeLayerActionWrap" class="ae-layer-action-wrap" style="display:none">
          <button class="button button-accent button-large button-full" id="detectActiveLayerBtn" onclick="App.startImportFromActiveLayer()">
            <svg class="icon"><use href="#icon-layers"/></svg> Detect Selected Layer (<span id="aeLayerBtnName">Footage</span>)
          </button>
        </div>

        <div class="import-buttons">
          <button class="button button-large button-accent-hover" onclick="App.startImport()">
            <svg class="icon"><use href="#icon-folder"/></svg> Browse File
          </button>
        </div>
        <div class="import-divider">
          <span>or drop video file</span>
        </div>
        <p class="import-hint">MP4, MKV, MOV supported</p>
      </div>

      <div class="ep-lib">
        <div class="ep-lib-header">
          <div class="ep-lib-title">Episode Library <span class="ep-lib-count" id="epLibCount">0</span></div>
          <div class="ep-lib-actions">
            <button type="button" class="ep-lib-action" id="epLibSortBtn" onclick="HistoryPanel.toggleSort()" title="Sort A-Z">
              <svg class="icon"><use href="#icon-sort"/></svg>
            </button>
            <button type="button" class="ep-lib-action danger" id="historyClearBtn" style="display:none"
                    onclick="HistoryPanel.promptClearAll()" title="Clear extension history">
              <svg class="icon"><use href="#icon-trash"/></svg>
            </button>
          </div>
        </div>

        <div class="ep-lib-search">
          <svg class="icon ep-lib-search-icon"><use href="#icon-search"/></svg>
          <input type="text" class="ep-lib-search-input" id="epLibSearchInput" placeholder="Search episodes..." oninput="HistoryPanel.setSearch(this.value)">
          <button type="button" class="ep-lib-search-clear" id="epLibSearchClear" style="display:none" onclick="HistoryPanel.clearSearch()" title="Clear search">
            <svg class="icon"><use href="#icon-x"/></svg>
          </button>
        </div>

        <div class="ep-lib-list" id="historyList"></div>
      </div>
    </div>
    <div id="importProgress" class="import-progress" style="display:none">
      <div class="import-status-row">
        <span class="import-label">Detecting scenes...</span>
        <span class="import-pct" id="importPct">0%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="importProgressFill" style="width:0%"></div></div>
      
      <div class="import-time-row">
        <div class="import-time-stat">
          <span class="import-time-label">Elapsed</span>
          <span class="import-time-val" id="importElapsedVal">00:00</span>
        </div>
        <div class="import-time-stat">
          <span class="import-time-label">ETA</span>
          <span class="import-time-val" id="importEtaVal">--:--</span>
        </div>
      </div>

      <div class="import-status-text" id="importStatusText">Initializing...</div>
      <div class="import-cancel-row">
        <button class="button button-danger" onclick="App.cancelDetection()">
          <svg class="icon"><use href="#icon-x"/></svg> Cancel
        </button>
      </div>
    </div>
  </div>

  <div id="scenePanel" class="scene-panel" style="display:none">
    <div class="split-layout" id="splitLayout">
      <div class="left-pane">
        <div class="pane-header">
          <div class="pane-header-left">
            <span class="pane-title">Scenes</span>
            <span class="scene-count" id="sceneCount">0</span>
          </div>
          <div class="pane-header-actions">
            <div class="density-toggles">
              <button class="density-btn" data-density="compact" onclick="ClipsPanel.setDensity('compact')" title="Compact View">S</button>
              <button class="density-btn active" data-density="normal" onclick="ClipsPanel.setDensity('normal')" title="Standard View">M</button>
              <button class="density-btn" data-density="large" onclick="ClipsPanel.setDensity('large')" title="Large View">L</button>
            </div>
            <div class="selection-pill-group">
              <button class="pill-action-btn" onclick="ClipsPanel.selectAll()">All</button>
              <button class="pill-action-btn" onclick="ClipsPanel.deselectAll()">None</button>
            </div>
          </div>
        </div>
        <div class="clips-container" id="clipsContainer">
          <div class="clips-grid" id="clipsGrid"></div>
        </div>
      </div>
      <div class="divider" id="mainDivider"></div>
      <div class="right-pane" id="rightPane">
        <div class="preview-container" id="previewContainer">
          <div class="preview-window" id="previewWindow">
            <div class="preview-empty" id="previewEmpty">
              <svg class="icon"><use href="#icon-video"/></svg>
              <p>Select a scene</p>
            </div>
            <!-- same structure the desktop app uses: .video-wrapper > .video-frame
                 > video + .controls, so the skin and its CSS port across as-is -->
            <div class="video-wrapper" id="previewPlayer" style="display:none">
              <div class="video-frame">
                <video class="preview-video" id="previewVideo" playsinline></video>
                <div class="video-busy" aria-hidden="true">
                  <span class="video-busy-spinner"></span>
                  <span>Preparing preview...</span>
                </div>
                <div class="controls">
                  <button type="button" id="pvPlayBtn" aria-label="Play">
                    <svg class="icon"><use href="#icon-play"/></svg>
                  </button>

                  <span class="time-display" id="pvTime">0:00 / 0:00</span>

                  <div class="progress" id="pvProgress">
                    <progress id="pvProgressBar" value="0" max="1"></progress>
                  </div>

                  <div class="volume-control" id="pvVolumeControl">
                    <button type="button" id="pvMuteBtn" aria-label="Mute">
                      <svg class="icon"><use href="#icon-volume"/></svg>
                    </button>
                    <div class="volume-popup">
                      <input type="range" class="volume-slider" id="pvVolume"
                             min="0" max="1" step="0.01" value="1" aria-label="Volume">
                    </div>
                  </div>

                  <button type="button" id="pvFullscreenBtn" aria-label="Fullscreen">
                    <svg class="icon"><use href="#icon-expand"/></svg>
                  </button>
                </div>
              </div>
            </div>
          </div>
          <div class="import-actions">
            <button class="button button-full button-accent-hover" id="importToAeBtn" onclick="App.importSelectedToAE()" disabled>
              <svg class="icon"><use href="#icon-import"/></svg> Import Selected to AE
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
